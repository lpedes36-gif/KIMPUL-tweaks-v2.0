name: Build KIMPUL TWEAKS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify Node.js version
        run: node --version

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9 (no wrapper required)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          dependency-graph: disabled

      - name: Repair flat Android project layout if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app/build.gradle ] && [ -f AndroidManifest.xml ] && [ -f MainActivity.java ]; then
            echo "Detected flat project layout; creating Android app module..."
            mkdir -p app/src/main/java/id/kimpul/tweaks
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
            cp MainActivity.java app/src/main/java/id/kimpul/tweaks/MainActivity.java
            cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
            cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KIMPUL_TWEAKS_V2"
          include(":app")
          EOF
            cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'id.kimpul.tweaks'
              compileSdk 35

              defaultConfig {
                  applicationId 'id.kimpul.tweaks'
                  minSdk 24
                  targetSdk 28
                  versionCode 2
                  versionName '2.0.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'dev.rikka.shizuku:api:13.1.5'
          }
          EOF
          fi
          echo "Project root files:"
          ls -la
          echo "App module files:"
          find app -maxdepth 6 -type f | sort || true

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: settings.gradle tidak ditemukan di root repositori."
            exit 1
          fi
          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle tidak ditemukan setelah pemeriksaan struktur."
            find . -maxdepth 5 -type f | sort | head -n 150
            exit 1
          fi
          echo "dir=." >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: KIMPUL-TWEAKS-v2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
